<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Inbox — Unified Reply Portal</title>
<style>
  /* ============ THEME TOKENS ============ */
  :root{
    --accent:#6d5cff; --accent-2:#8b6bff; --good:#0ca30c; --down:#d03b3b;
    --radius:14px;
    /* platform brand colors (used only on small icons) */
    --ig:#e1306c; --yt:#ff0000; --tt:#00f2ea; --snap:#fffc00;
    --fb:#1877f2; --disc:#5865f2; --mail:#34b7f1; --sms:#12b76a;
  }
  :root[data-theme="light"]{
    --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f1f1ee; --surface-3:#ebebe7;
    --line:#e8e7e2; --line-2:#dedcd5;
    --txt:#181818; --txt-2:#565550; --txt-3:#9a988f;
    --accent-soft:rgba(109,92,255,.09);
    --good-soft:rgba(12,163,12,.10);
    --bubble:#f3f3f0;
    --shadow:0 1px 2px rgba(20,20,20,.05);
    --chart-track:#eeeeea;
    --tint-todo:rgba(208,59,59,.05); --tint-todo-h:rgba(208,59,59,.10);
    --tint-sent:rgba(12,163,12,.08); --tint-sent-h:rgba(12,163,12,.13);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0f1013; --surface:#16181d; --surface-2:#1b1e24; --surface-3:#22262e;
    --line:#24272f; --line-2:#2e323b;
    --txt:#e9ecf1; --txt-2:#a1a8b4; --txt-3:#6b7280;
    --accent:#8b78ff; --accent-2:#a488ff;
    --accent-soft:rgba(139,120,255,.15);
    --good:#2fd98a; --good-soft:rgba(47,217,138,.13);
    --bubble:#20242c;
    --shadow:0 2px 8px rgba(0,0,0,.3);
    --chart-track:#232730;
    --tint-todo:rgba(255,91,106,.08); --tint-todo-h:rgba(255,91,106,.14);
    --tint-sent:rgba(47,217,138,.09); --tint-sent-h:rgba(47,217,138,.15);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:2px solid transparent;background-clip:padding-box}

  .app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}

  /* ============ SIDEBAR ============ */
  .sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
  .brand .logo svg{width:16px;height:16px}
  .brand h1{font-size:14.5px;margin:0;font-weight:650}
  .brand p{margin:1px 0 0;font-size:11px;color:var(--txt-3)}

  .nav{padding:4px 12px}
  .nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;background:transparent;
    color:var(--txt-2);border-radius:9px;font-size:13.5px;font-weight:500;text-align:left;margin-bottom:1px}
  .nav-btn:hover{background:var(--surface-2);color:var(--txt)}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent)}
  .nav-btn svg{width:17px;height:17px}

  .side-label{padding:16px 18px 8px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--txt-3);font-weight:600}
  .channels{overflow-y:auto;flex:1;padding:0 12px 12px}
  .chan{width:100%;display:flex;align-items:center;gap:11px;padding:8px 10px;border:0;background:transparent;
    color:var(--txt-2);border-radius:9px;font-size:13px;text-align:left;margin-bottom:1px}
  .chan:hover{background:var(--surface-2);color:var(--txt)}
  .chan.active{background:var(--surface-2);color:var(--txt);font-weight:600}
  .chan .ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
  .chan .ico svg{width:12px;height:12px}
  .chan .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{min-width:19px;height:18px;padding:0 6px;border-radius:20px;background:var(--surface-3);color:var(--txt-2);
    font-size:11px;font-weight:600;display:grid;place-items:center}
  .chan.active .badge{background:var(--accent);color:#fff}

  .side-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:650;font-size:12px;color:#fff;flex:none}
  .side-foot .nm{font-size:12.5px;font-weight:600}
  .side-foot .sub{font-size:11px;color:var(--txt-3)}
  .theme-toggle{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
    display:grid;place-items:center;color:var(--txt-2)}
  .theme-toggle:hover{color:var(--txt);border-color:var(--line-2)}
  .theme-toggle svg{width:16px;height:16px}

  /* ============ MAIN ============ */
  .main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
  .topbar h2{margin:0;font-size:16px;font-weight:650}
  .topbar .sub{font-size:12px;color:var(--txt-3);margin-top:2px}
  .search{flex:1;max-width:320px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;background:var(--surface-2);border:1px solid transparent;
    border-radius:10px;color:var(--txt);font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent);background:var(--surface)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt-3)}
  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{background:var(--surface-2)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.good:hover{filter:brightness(1.05)}
  .btn.learn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btn.learn:hover{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--txt-2)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--txt)}
  .btn.sm{padding:7px 11px;font-size:12.5px}

  .filters{display:flex;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--txt-2);
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .chip:hover{color:var(--txt)}
  .chip.active{background:var(--txt);color:var(--surface);border-color:var(--txt)}
  .filters .count{margin-left:auto;font-size:12px;color:var(--txt-3);white-space:nowrap;padding-left:10px}

  /* ============ INBOX ============ */
  .inbox{display:grid;grid-template-columns:minmax(320px,400px) 1fr;flex:1;overflow:hidden}
  .list{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg)}
  .item{display:flex;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
  .item.todo{background:var(--tint-todo)}
  .item.done{background:var(--tint-sent);opacity:.85}
  .item.todo:hover{background:var(--tint-todo-h)}
  .item.done:hover{background:var(--tint-sent-h)}
  .item.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .item.active .it-name{font-weight:700}
  .thumb{position:relative;flex:none}
  .thumb .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:650;color:#fff;font-size:14px}
  .thumb .pf{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:6px;border:2px solid var(--bg);display:grid;place-items:center}
  .item.active .thumb .pf{border-color:var(--surface)}
  .thumb .pf svg{width:10px;height:10px}
  .it-body{flex:1;min-width:0}
  .it-top{display:flex;align-items:baseline;gap:7px}
  .it-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-handle{font-size:12px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .it-time{font-size:11.5px;color:var(--txt-3);white-space:nowrap;flex:none}
  .it-msg{font-size:12.5px;color:var(--txt-2);margin-top:4px;padding-right:46px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
  .it-unread{position:absolute;right:16px;bottom:16px;width:8px;height:8px;border-radius:50%;background:var(--down)}
  .it-sent{position:absolute;right:15px;bottom:14px;font-size:11px;font-weight:600;color:var(--good);display:flex;align-items:center;gap:4px}
  .it-sent svg{width:12px;height:12px}

  .empty{display:grid;place-items:center;height:100%;color:var(--txt-3);text-align:center;padding:40px}
  .empty svg{width:42px;height:42px;opacity:.5;margin-bottom:14px}
  .empty b{color:var(--txt-2)}

  /* ============ DETAIL ============ */
  .detail{overflow-y:auto;background:var(--surface);display:flex;flex-direction:column}
  .d-head{display:flex;align-items:center;gap:12px;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
  .d-head .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:650;color:#fff}
  .d-head .meta h3{margin:0;font-size:15px;font-weight:650}
  .d-head .meta .chn{font-size:12px;color:var(--txt-3);display:flex;align-items:center;gap:6px;margin-top:3px}
  .d-head .meta .chn .ico{width:15px;height:15px;border-radius:5px;display:grid;place-items:center}
  .d-head .meta .chn .ico svg{width:9px;height:9px}
  .d-head .kbd-hint{margin-left:auto;font-size:11px;color:var(--txt-3);display:flex;align-items:center;gap:5px}
  .kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;font-size:11px;color:var(--txt-2);background:var(--surface-2)}
  .conv{padding:24px 26px;flex:1}
  .bubble-in{background:var(--bubble);border-radius:4px 15px 15px 15px;padding:14px 16px;max-width:80%;font-size:14px;line-height:1.5}
  .bubble-in .m-meta{font-size:11px;color:var(--txt-3);margin-top:8px}

  .composer{border-top:1px solid var(--line);background:var(--surface);padding:16px 26px 22px;position:sticky;bottom:0}
  .c-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--txt-3);margin-bottom:10px}
  .c-label svg{width:14px;height:14px;color:var(--accent)}
  .c-label .pill{margin-left:auto;font-size:11px;color:var(--txt-3)}
  .draft-box{width:100%;min-height:84px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);font-size:14px;padding:14px;resize:vertical;line-height:1.55;outline:none;font-family:inherit}
  .draft-box:focus{border-color:var(--accent);background:var(--surface)}
  .c-actions{display:flex;align-items:flex-start;gap:9px;margin-top:12px;flex-wrap:wrap}
  .act{display:flex;flex-direction:column;align-items:center;gap:4px}
  .sc{font-size:10px;color:var(--txt-3);white-space:nowrap;letter-spacing:.2px}
  .sc b{font-weight:600;color:var(--txt-2)}
  .mini{font-size:11px;color:var(--txt-3);padding-top:9px}

  /* ============ PAGE (tone + analytics) ============ */
  .page{flex:1;overflow-y:auto;padding:30px 40px 70px;background:var(--bg)}
  .page.hidden,.inbox.hidden,.filters.hidden{display:none}
  .wrap{max-width:920px;margin:0 auto}
  .page-head{margin-bottom:24px}
  .page-head h2{margin:0 0 6px;font-size:21px;font-weight:680}
  .page-head p{margin:0;color:var(--txt-2);font-size:13.5px;line-height:1.6;max-width:660px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
  .card h4{margin:0 0 4px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
  .card h4 svg{width:16px;height:16px;color:var(--accent)}
  .card .hint{font-size:12px;color:var(--txt-3);margin:0 0 14px;line-height:1.5}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  textarea.field,input.field{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font-size:13.5px;padding:12px 13px;outline:none;font-family:inherit;line-height:1.55}
  textarea.field:focus,input.field:focus{border-color:var(--accent);background:var(--surface)}
  textarea.field{min-height:118px;resize:vertical}
  .fld-label{font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:7px;display:block}
  .vibes{display:flex;flex-wrap:wrap;gap:8px}
  .vibe{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--txt-2);font-size:13px;font-weight:600}
  .vibe.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{padding:7px 15px;border:0;background:transparent;color:var(--txt-2);border-radius:8px;font-size:12.5px;font-weight:600}
  .seg button.active{background:var(--accent);color:#fff}
  .preview{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--txt);white-space:pre-wrap;min-height:56px}
  .preview .ph{color:var(--txt-3);font-style:italic}
  .save-bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,transparent,var(--bg) 45%);padding:18px 0 4px;margin-top:18px}
  .saved-flag{font-size:12.5px;color:var(--good);display:none;align-items:center;gap:6px;font-weight:600}
  .saved-flag.show{display:flex}
  .saved-flag svg{width:15px;height:15px}

  /* ============ ANALYTICS ============ */
  .a-controls{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .a-controls .spacer{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:12px;color:var(--txt-3);font-weight:500}
  .kpi .n{font-size:26px;font-weight:720;margin-top:6px;letter-spacing:-.5px}
  .kpi .d{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
  .kpi .d svg{width:13px;height:13px}
  .d.up{color:var(--good)} .d.down{color:var(--down)}
  .kpi .sub{font-size:11px;color:var(--txt-3);margin-top:4px}

  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px 16px;box-shadow:var(--shadow);margin-bottom:18px}
  .chart-card .ch-head{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
  .chart-card .ch-head h4{margin:0;font-size:14px;font-weight:650}
  .chart-card .ch-head .ch-sub{font-size:12px;color:var(--txt-3);margin-left:auto}
  .bars{display:flex;align-items:flex-end;gap:10px;height:210px;padding-top:10px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;position:relative}
  .bar{width:100%;max-width:46px;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;transition:opacity .12s;position:relative}
  .bar-col:hover .bar{opacity:.82}
  .bar.dim{background:var(--chart-track)}
  .bar-x{font-size:11px;color:var(--txt-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bar-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--txt);color:var(--surface);
    padding:7px 10px;border-radius:8px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2);text-align:center;line-height:1.5}
  .bar-col:hover .bar-tip{opacity:1}
  .bar-tip b{font-size:13px}
  .bar-tip .t-d{font-weight:600}
  .t-d.up{color:#7ee0a6}.t-d.down{color:#ff9b9b}
  :root[data-theme="light"] .bar-tip .t-d.up{color:#7ee0a6}

  .platform-list{display:flex;flex-direction:column;gap:13px;margin-top:4px}
  .pf-row{display:flex;align-items:center;gap:12px}
  .pf-row .ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
  .pf-row .ico svg{width:14px;height:14px}
  .pf-row .pf-name{width:150px;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .pf-track{flex:1;height:9px;background:var(--chart-track);border-radius:20px;overflow:hidden}
  .pf-fill{height:100%;background:var(--accent);border-radius:20px}
  .pf-val{width:96px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
  .pf-val b{font-weight:650}
  .pf-val span{color:var(--txt-3);font-size:11.5px}

  /* ============ TOAST ============ */
  .toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;align-items:center}
  .toast{background:var(--txt);color:var(--surface);padding:11px 17px;border-radius:11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .22s ease}
  .toast svg{width:15px;height:15px;color:#6ee29f}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #refreshBtn.spin svg{animation:spin .6s linear}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* ============ FANS ============ */
  .fan-controls{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .fan-row{display:flex;align-items:center;gap:14px;padding:13px 12px;margin:0 -12px;border-bottom:1px solid var(--line);border-radius:9px}
  .fan-row:last-child{border-bottom:0}
  .fan-row.clickable{cursor:pointer;transition:background .12s}
  .fan-row.clickable:hover{background:var(--surface-2)}
  .fan-open{width:22px;flex:none;display:flex;justify-content:center;color:var(--txt-3);opacity:0;transition:opacity .12s,color .12s}
  .fan-row.clickable:hover .fan-open{opacity:1}
  .fan-row.clickable:hover .fan-open{color:var(--accent)}
  .fan-open svg{width:15px;height:15px}
  .fan-rank{width:24px;text-align:center;font-weight:700;font-size:14px;color:var(--txt-3);font-variant-numeric:tabular-nums;flex:none}
  .fan-rank.g1{color:#e0a53a}.fan-rank.g2{color:#9aa3ad}.fan-rank.g3{color:#c08457}
  .fan-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:650;color:#fff;font-size:14px;flex:none;position:relative}
  .fan-av .pf{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:5px;border:2px solid var(--surface);display:grid;place-items:center}
  .fan-av .pf svg{width:9px;height:9px}
  .fan-id{width:210px;flex:none;min-width:0}
  .fan-id .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fan-id .hd{font-size:12px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fan-count{width:150px;text-align:right;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
  .fan-count b{font-weight:700;font-size:14px}
  .fan-count span{color:var(--txt-3);font-size:11.5px}

function firstName(n){return (n||'').split(/[\s(]/)[0].replace(/[^A-Za-z].*$/,'')||'friend';}
function pick(a,s){return a[s%a.length];}
const EMOJI_RE=/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}‍️]/gu;
function parseEmojis(str){return (String(str||'').match(/\p{Extended_Pictographic}/gu))||[];}
function bodyFor(m){const t=m.topic;switch(m.intent){
  case 'compliment':return[`this honestly means a lot — thank you for ${t}`,`okay this made my day, seriously appreciate you noticing ${t}`,`thank you!! comments like this are why i keep going`];
  case 'question':return[`great question — ${t} is actually what people ask most. short version: keep it simple and stay consistent, i'll do a full breakdown soon`,`love that you asked about ${t}! i'll drop a proper answer on this because it deserves more than a comment`,`ohh ${t} — happy to help, i'll DM you the details so it's not lost in here`];

  case 'troll':return[`all good — not everything's for everyone. appreciate you stopping by anyway`,`fair enough! thanks for watching either way`,`respect the honesty — i'll keep working on it`];

function greetingFor(m){const fn=firstName(m.name);if(m.intent==='troll')return '';

  if(tone.vibe==='pro')return pick(pro,m.id);if(tone.vibe==='sweet')return pick(warm,m.id);return pick(casual,m.id);}
function applyEmoji(text,m){
  // strip any emojis from the generated body so the tone sheet's list is the single source of truth
  let base=text.replace(EMOJI_RE,'').replace(/\s+([.!?,])/g,'$1').replace(/\s{2,}/g,' ').trim();
  const list=parseEmojis(tone.emojis);
  if(!list.length)return base;                                   // no emojis listed → clean text
  if(m.intent==='troll')return base;                             // never on negative replies
  if(m.intent==='question'&&m.id%2)return base;                  // sparse on questions
  let out=base+' '+list[m.id%list.length];
  if(m.intent==='support'&&list.length>1)out+=' '+list[(m.id+1)%list.length];
  return out;}

function injectPhrase(text,m){const p=tone.phrases.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);if(!p.length)return text;if(m.id%2===0)return text+' — '+pick(p,m.id);return text;}
function generateDraft(m){let g=greetingFor(m),b=pick(bodyFor(m),m.id);b=injectPhrase(b,m);let full=g+b;if(tone.vibe==='pro')full=full.charAt(0).toUpperCase()+full.slice(1);full=applyEmoji(full,m);full=full+signature();return full.trim();}

/* ============ ANALYTICS DATA (deterministic mock) ============ */
function seeded(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return (s-1)/2147483646;};}
// build ~180 days of per-channel daily counts with an upward growth trend + weekly seasonality
const DAY_MS=86400000;
const today=new Date(); today.setHours(0,0,0,0);
const HIST=[]; // [{date, counts:{chId:n}, total}]
(function buildHistory(){
  const rnd=seeded(97);
  const chBase={'ig-dm':6,'ig-cmt':11,'yt-cmt':9,'tt-cmt':14,'tt-dm':5,'snap-cmt':7,'fb-cmt':4,'fb-msgr':3,'discord':8,'email':2,'sms':3};
  for(let i=179;i>=0;i--){
    const date=new Date(today.getTime()-i*DAY_MS);
    const dow=date.getDay();
    const weekendBoost=(dow===0||dow===6)?1.25:1;
    const daysAgo=i;
    const growth=Math.pow(1.0022,(180-daysAgo)); // ~compounding growth toward today
    const counts={};let total=0;
    CHANNELS.forEach(c=>{
      const base=chBase[c.id]||4;
      const noise=0.7+rnd()*0.7;
      let n=Math.round(base*growth*weekendBoost*noise);
      counts[c.id]=n;total+=n;
    });
    HIST.push({date,counts,total});
  }
})();

function fmtInt(n){return n.toLocaleString('en-US');}
function ymd(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

// Build display buckets for a granularity. Returns {buckets:[{label,total,counts,sub}], windowTotal, counts}
function buildBuckets(gran){
  if(gran==='day'){
    // exclude today (partial) → last 14 complete days
    const days=HIST.slice(0,-1).slice(-14);
    return days.map(d=>({label:(d.date.getMonth()+1)+'/'+d.date.getDate(),total:d.total,counts:d.counts,
      full:d.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}));
  }
  if(gran==='week'){
    // group into weeks (Mon start); keep only complete 7-day weeks, last 12
    const weeks=[];let cur=null;
    HIST.forEach(d=>{
      const dow=(d.date.getDay()+6)%7; // Mon=0
      if(dow===0||!cur){ if(cur)weeks.push(cur); cur={start:new Date(d.date),total:0,counts:{},days:0}; }
      cur.total+=d.total;cur.days++;CHANNELS.forEach(c=>cur.counts[c.id]=(cur.counts[c.id]||0)+d.counts[c.id]);
    });
    if(cur)weeks.push(cur);
    return weeks.filter(w=>w.days===7).slice(-12).map(w=>({label:(w.start.getMonth()+1)+'/'+w.start.getDate(),total:w.total,counts:w.counts,
      full:'Week of '+w.start.toLocaleDateString('en-US',{month:'short',day:'numeric'})}));
  }
  // month — keep only complete months, last 6
  const months={};const order=[];
  HIST.forEach(d=>{const k=d.date.getFullYear()+'-'+d.date.getMonth();if(!months[k]){months[k]={d:new Date(d.date.getFullYear(),d.date.getMonth(),1),total:0,counts:{},days:0};order.push(k);}months[k].total+=d.total;months[k].days++;CHANNELS.forEach(c=>months[k].counts[c.id]=(months[k].counts[c.id]||0)+d.counts[c.id]);});
  const complete=order.filter(k=>{const m=months[k];const dim=new Date(m.d.getFullYear(),m.d.getMonth()+1,0).getDate();return m.days===dim;});
  return complete.slice(-6).map(k=>({label:months[k].d.toLocaleDateString('en-US',{month:'short'}),total:months[k].total,counts:months[k].counts,
    full:months[k].d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}));
}

    if(state.search){const q=state.search.toLowerCase();if(!(m.name+m.handle+m.text).toLowerCase().includes(q))return false;}

function initials(n){const p=n.replace(/[^A-Za-z ].*$/,'').trim().split(/\s+/);return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||n.slice(0,2).toUpperCase();}

function approveAndLearn(id){const el=document.getElementById('draft-'+id);const text=el?el.value:(state.drafts[id]||'');state.drafts[id]=text;appendToneSample(text);state.sent[id]=true;const m=MESSAGES.find(x=>x.id===id);toast(`Sent + saved to your tone sheet ✓`);const msgs=visibleMessages();const next=msgs.find(x=>!state.sent[x.id]);if(next)state.selected=next.id;render();}
function appendToneSample(text){const clean='"'+String(text||'').replace(/\s*\n+\s*/g,' ').trim()+'"';if(!clean||clean==='""')return;tone.samples=(tone.samples&&tone.samples.trim())?tone.samples.trim()+'\n'+clean:clean;}

  if(state.view!=='inbox')return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT')return;
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='j'&&e.key!=='k')return;
  const msgs=visibleMessages();if(!msgs.length)return;
  let i=msgs.findIndex(m=>m.id===state.selected);if(i<0)i=0;
  if(e.key==='ArrowDown'||e.key==='j')i=Math.min(msgs.length-1,i+1);

/* ============ ANALYTICS RENDER ============ */
function renderAnalytics(){
  const p=document.getElementById('analyticsPage');
  const gran=state.gran;

  // period-over-period: compare recent half vs previous half of shown buckets
  const half=Math.floor(buckets.length/2);
  const recent=buckets.slice(-half).reduce((a,b)=>a+b.total,0);
  const prior=buckets.slice(0,buckets.length-half).slice(-half).reduce((a,b)=>a+b.total,0);
  const delta=prior?((recent-prior)/prior*100):0;
  const perLabel={day:'day',week:'week',month:'month'}[gran];
  const windowLabel='last '+buckets.length+' '+perLabel+'s';
  const avg=Math.round(windowTotal/buckets.length);

  const pfSorted=CHANNELS.map(c=>({c,n:pf[c.id]})).sort((a,b)=>b.n-a.n);
  const top=pfSorted[0];const pfMax=pfSorted[0].n||1;
  const max=Math.max(...buckets.map(b=>b.total),1);

  p.innerHTML=`<div class="wrap">
    <div class="page-head"><h2>Analytics</h2><p>How many fan messages you're getting across every platform — and whether that's growing. Switch between day, week, and month to compare periods and spot the trend.</p></div>

    <div class="a-controls">
      <div class="seg">
        ${['day','week','month'].map(g=>`<button class="${gran===g?'active':''}" onclick="setGran('${g}')">By ${g}</button>`).join('')}
      </div>
      <div class="spacer"></div>
      <span style="font-size:12px;color:var(--txt-3)">Showing ${windowLabel}</span>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">Total fan messages</div><div class="n">${fmtInt(windowTotal)}</div><div class="sub">${windowLabel}</div></div>
      <div class="kpi"><div class="l">vs previous period</div><div class="n">${delta>=0?'+':''}${delta.toFixed(1)}%</div>
        <div class="d ${delta>=0?'up':'down'}">${arrow(delta)} ${fmtInt(recent)} vs ${fmtInt(prior)}</div></div>
      <div class="kpi"><div class="l">Average per ${perLabel}</div><div class="n">${fmtInt(avg)}</div><div class="sub">across the window</div></div>
      <div class="kpi"><div class="l">Busiest platform</div><div class="n" style="font-size:18px;margin-top:10px;display:flex;align-items:center;gap:8px"><span class="ico" style="width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:${top.c.bg}">${colorGlyph(top.c)}</span>${top.c.name.replace(' Comments','').replace(' Messenger',' Msgr')}</div><div class="sub">${fmtInt(top.n)} messages</div></div>
    </div>

    <div class="chart-card">
      <div class="ch-head"><h4>Messages per ${perLabel}</h4><span class="ch-sub">hover a bar for the change vs the ${perLabel} before</span></div>
      <div class="bars">
        ${buckets.map((b,i)=>{
          const h=Math.round(b.total/max*100);
          const prev=i>0?buckets[i-1].total:null;
          const chg=prev?((b.total-prev)/prev*100):null;
          const isLast=i===buckets.length-1;
          return `<div class="bar-col">
            <div class="bar-tip"><b>${fmtInt(b.total)}</b><br/>${b.full}${chg!==null?`<br/><span class="t-d ${chg>=0?'up':'down'}">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(0)}% vs prev</span>`:''}</div>
            <div class="bar ${isLast?'':''}" style="height:${h}%;${isLast?'':'opacity:.9'}"></div>
            <div class="bar-x">${b.label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="chart-card">
      <div class="ch-head"><h4>By platform</h4><span class="ch-sub">${windowLabel} · ${fmtInt(windowTotal)} total</span></div>

(async function initLive(){
  let status;
  try { status = await fetch('/api/status').then(r=>r.json()); }
  catch(e){ return; } // not served by backend (opened as plain file) → stay in demo mode
  window.__live = !!(status.connected || status.ytConnected);

  // 1) Make the Email "Connect" button start the real Google sign-in
  const origConnect = window.connect;
  window.connect = function(id, name){
    if(id === 'email'){ window.location.href = '/auth/google'; return; }
    if(id === 'youtube'){ window.location.href = '/auth/google/youtube'; return; }
    origConnect(id, name);
  };

  // Reflect real connection state on the Connections screen
  if(status.connected) state.connections['email'] = true;
  if(status.ytConnected) state.connections['youtube'] = true;
  if((status.connected || status.ytConnected) && state.view === 'connect') renderConnect();
  // Friendly heads-up if keys aren't in place yet
  if(!status.hasGoogleKeys){
    const c = CONNECTORS.find(c=>c.id==='email');
    if(c) c.cap = 'Add your Google keys in the host settings to enable this (see README). ' + c.cap;
  }

  // 2) Refresh pulls REAL emails when connected, otherwise keeps demo behavior
  const origRefresh = window.refreshMessages;
  window.refreshMessages = async function(){
    const btn = document.getElementById('refreshBtn');
    if(btn) btn.classList.add('spin');
    setTimeout(()=>btn && btn.classList.remove('spin'), 600);
    if(!window.__live) return origRefresh();
    try{
      const emails = await fetch('/api/messages').then(r=>r.json());
      let added = 0;
      emails.forEach(e=>{
        if(MESSAGES.find(x=>x.gid === e.gid)) return; // already have it
        const nm = { id: idc++, ch: e.ch || 'email', name:e.name, handle:e.handle, text:e.text,
                     intent:'question', topic:'', time:e.time, live:true, gid:e.gid,
                     threadId:e.threadId, subject:e.subject };
        MESSAGES.unshift(nm);
        state.drafts[nm.id] = e.draft || generateDraft(nm);
        added++;
      });
      if(state.view !== 'inbox') setView('inbox'); else render();
      toast(added ? `${added} new email${added>1?'s':''} came in` : 'No new emails right now');
    }catch(err){ toast('Could not reach your inbox'); }
  };

  // 3) Approving a REAL email actually sends it through Gmail
  function wrapSend(fn){
    return async function(id){
      const m = MESSAGES.find(x=>x.id === id);
      if(m && m.live){
        const el = document.getElementById('draft-' + id);
        const text = el ? el.value : (state.drafts[id] || '');
        try{
          const r = await fetch('/api/send', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ gid:m.gid, threadId:m.threadId, to:m.handle, text })
          });
          if(!r.ok){ toast('Send failed — check the connection'); return; }
        }catch(e){ toast('Send failed'); return; }
      }
      return fn(id);
    };
  }
  window.approve = wrapSend(window.approve);
  window.approveAndLearn = wrapSend(window.approveAndLearn);

  // 4) Auto-pull once on load if already connected
  if(window.__live){ setTimeout(()=>window.refreshMessages(), 400); }
})();
</script>
</body>
</html>
